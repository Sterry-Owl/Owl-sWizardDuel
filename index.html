<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Duel - Advanced Combat Arena</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 連線與動態選角大廳 -->
        <div id="lobby-panel" class="overlay-panel">
            <h2 id="lobby-title">巫師對決：戰鬥工坊</h2>
            
            <div id="room-controls">
                <div class="control-row">
                    <button id="btn-practice-mode" type="button" class="btn-primary">進入單人訓練場</button>
                    <button id="btn-create-room" type="button" class="btn-secondary">建立雙人房間</button>
                </div>
                <div class="control-row">
                    <span id="room-id-display">房間代碼：未建立</span>
                </div>
                <div class="control-row">
                    <input id="input-room-id" type="text" placeholder="輸入 4 位數房間代碼 (例: 1234)">
                    <button id="btn-join-room" type="button" class="btn-secondary">加入連線</button>
                </div>
                <div id="connection-status">狀態：等待玩家配置中...</div>
            </div>

            <!-- 動態資料掛載容器 -->
            <div id="loadout-selection" class="hidden">
                <div class="section-title">1. 選擇核心記憶 (Core Memory)</div>
                <div id="dynamic-cores-container" class="grid-container"></div>

                <div class="section-title">2. 注入流變天賦 (Flux Modifiers)</div>
                <div id="dynamic-flux-container" class="grid-container"></div>

                <div class="section-title">3. 狂想機制重構 (Rhapsody Mutations)</div>
                <div id="dynamic-rhapsody-container" class="grid-container"></div>

                <div class="action-footer">
                    <button id="btn-ready" type="button" class="btn-primary">確認並鎖定配置</button>
                    <div id="ready-status">配置未鎖定</div>
                </div>
            </div>
        </div>

        <!-- 戰鬥場景容器 -->
        <div id="battle-container" class="hidden">
            <div id="hud-top">
                <div class="player-hud-card" id="p1-card">
                    <div class="hud-name" id="p1-name">P1</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="p1-hp-fill"></div></div>
                    <div class="hp-text" id="p1-hp-text">0/0</div>
                </div>

                <div id="match-timer">DUEL ARENA</div>

                <div class="player-hud-card" id="p2-card">
                    <div class="hud-name" id="p2-name">P2</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="p2-hp-fill"></div></div>
                    <div class="hp-text" id="p2-hp-text">0/0</div>
                </div>
            </div>

            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <div id="hud-bottom">
                <div class="skill-slot" id="slot-attack">
                    <span class="slot-key">左鍵</span>
                    <span class="slot-name">普攻</span>
                    <div class="cooldown-overlay" id="cd-attack"></div>
                </div>
                <div class="skill-slot" id="slot-1">
                    <span class="slot-key">Q</span>
                    <span class="slot-name" id="name-skill-1">-</span>
                    <div class="cooldown-overlay" id="cd-skill-1"></div>
                </div>
                <div class="skill-slot" id="slot-2">
                    <span class="slot-key">E</span>
                    <span class="slot-name" id="name-skill-2">-</span>
                    <div class="cooldown-overlay" id="cd-skill-2"></div>
                </div>
                <div class="skill-slot" id="slot-3">
                    <span class="slot-key">R</span>
                    <span class="slot-name" id="name-skill-3">-</span>
                    <div class="cooldown-overlay" id="cd-skill-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
