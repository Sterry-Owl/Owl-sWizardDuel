<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Duel - P2P Combat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 階段一與階段二：連線大廳與選角面板 -->
        <div id="lobby-panel" class="overlay-panel">
            <h2 id="lobby-title">巫師對決：連線大廳</h2>
            
            <div id="room-controls">
                <div class="control-group">
                    <button id="btn-create-room" type="button">建立房間 (身為主機)</button>
                    <span id="room-id-display">房間代碼：未建立</span>
                </div>
                <div class="control-group">
                    <input id="input-room-id" type="text" placeholder="輸入 8 碼房間代碼 (如: WZD-ABCD)">
                    <button id="btn-join-room" type="button">加入房間</button>
                </div>
                <div id="connection-status">連線狀態：等待操作...</div>
            </div>

            <div id="loadout-selection" class="hidden">
                <h3>配置戰鬥載荷</h3>
                <div class="selection-section">
                    <label>核心紡車 (角色)：</label>
                    <select id="select-core">
                        <option value="STAR_WEAVER">星軌編織者 (遠程魔法)</option>
                        <option value="IRON_OATH">鋼鐵誓約 (近戰物理)</option>
                    </select>
                </div>
                <div class="selection-section">
                    <label>流變天賦 (數值增強)：</label>
                    <div id="flux-options">
                        <label><input type="checkbox" value="FLUX_HP_BOOST"> 生命塑形 (+50 HP)</label>
                        <label><input type="checkbox" value="FLUX_SWIFT_FOOT"> 流光步法 (+15% 移速)</label>
                        <label><input type="checkbox" value="FLUX_AETHER_FLOW"> 乙太湧動 (-20% 普攻冷卻)</label>
                    </div>
                </div>
                <div class="selection-section">
                    <label>狂想重構 (機制變更)：</label>
                    <div id="rhapsody-options">
                        <label><input type="checkbox" value="RHAP_TRIPLE_BOLT"> 狂想：三重星軌 (星軌彈變為 3 發散射)</label>
                        <label><input type="checkbox" value="RHAP_COLOSSAL_CLEAVE"> 狂想：碎裂巨劈 (巨劈範圍放大 50%)</label>
                    </div>
                </div>
                <button id="btn-ready" type="button">確認並鎖定準備</button>
                <div id="ready-status">等待雙方鎖定準備...</div>
            </div>
        </div>

        <!-- 階段三：戰鬥畫面 -->
        <div id="battle-container" class="hidden">
            <div id="header-info">
                <span id="p1-info">P1 (房主)：HP 0/0</span>
                <span id="match-timer">戰鬥進行中</span>
                <span id="p2-info">P2 (訪客)：HP 0/0</span>
            </div>

            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <div id="hud-container">
                <div class="skill-slot" id="slot-attack">
                    <span class="slot-key">滑鼠左鍵</span>
                    <span class="slot-name">普攻</span>
                    <div class="cooldown-overlay" id="cd-attack"></div>
                </div>
                <div class="skill-slot" id="slot-1">
                    <span class="slot-key">Q / 1</span>
                    <span class="slot-name" id="name-skill-1">-</span>
                    <div class="cooldown-overlay" id="cd-skill-1"></div>
                </div>
                <div class="skill-slot" id="slot-2">
                    <span class="slot-key">W / 2</span>
                    <span class="slot-name" id="name-skill-2">-</span>
                    <div class="cooldown-overlay" id="cd-skill-2"></div>
                </div>
                <div class="skill-slot" id="slot-3">
                    <span class="slot-key">E / 3</span>
                    <span class="slot-name" id="name-skill-3">-</span>
                    <div class="cooldown-overlay" id="cd-skill-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
